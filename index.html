<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#611448"><title>Luqman &amp; Aina — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#611448;--ink:#fff8f1;--gold:#d9bc84;--muted:#b88aab}*{box-sizing:border-box}body{margin:0;opacity:0;animation:pageFadeIn 2.2s ease-out forwards;background:#f1e9ee;color:var(--ink);font-family:'Cormorant Upright',Georgia,serif;display:grid;place-items:center;padding:20px;min-height:100vh}.cover,.card{width:min(100%,520px);height:min(92vh,780px);min-height:610px;position:relative;overflow:hidden;box-shadow:0 18px 60px #30102444}.cover{background:#611448;display:grid;place-items:end center}.cover img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.cover:after{content:'';position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#2c0920cc)}.open{position:absolute;z-index:2;bottom:28px;background:#611448;color:#fff8f1;border:1px solid #d9bc84;padding:9px 26px;font:20px 'Cormorant Upright',Georgia,serif;letter-spacing:.08em;cursor:pointer}.card{display:none;background:var(--plum);text-align:center;padding:36px 28px}.card.visible{display:block;animation:rise .8s both}.card:before,.card:after{content:'✿';position:absolute;color:var(--muted);opacity:.52;font-size:150px;line-height:1;pointer-events:none}.card:before{top:-35px;left:-36px;transform:rotate(-28deg)}.card:after{bottom:-43px;right:-35px;transform:rotate(25deg)}.inner{position:relative;z-index:1}.eyebrow{color:var(--gold);font-size:17px;font-style:italic;letter-spacing:.04em;margin:0 0 12px}.sprig{font-size:34px;color:var(--gold);margin:0 0 8px}.title{font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px}.names{font-size:clamp(37px,8vw,52px);line-height:1.02;font-weight:400;margin:2px 0}.amp{color:var(--gold);font-style:italic;font-size:26px;margin:0}.rule{width:130px;border:0;border-top:1px solid var(--gold);margin:17px auto}.intro{font-size:18px;line-height:1.35;margin:0 auto;max-width:390px}.date{font-size:25px;letter-spacing:.1em;margin:1px 0}.time{font-size:19px;margin:0}.venue{font-size:19px;line-height:1.25;margin:0 auto;max-width:430px}.rsvp{display:inline-block;margin:18px auto 0;padding:9px 26px;border:1px solid var(--gold);background:transparent;color:var(--ink);font:20px 'Cormorant Upright',Georgia,serif;letter-spacing:.08em;cursor:pointer;transition:background .2s,color .2s}.rsvp:hover{background:var(--gold);color:var(--plum);}.note{font-size:14px;color:#ead9e5;margin:8px 0}.footer{font-size:16px;color:var(--gold);font-style:italic;margin-top:10px}.petals{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}.petal{position:absolute;top:-12%;color:#e4c8d9;font-size:22px;animation:fall 1.5s ease-in forwards;left:var(--x);animation-delay:var(--d)}.card.rsvp-motion{animation:celebrate .75s ease both}.rsvp[disabled]{opacity:.75;cursor:wait}.transition-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#611448;color:#fff8f1;font:26px 'Cormorant Upright',Georgia,serif;letter-spacing:.1em;opacity:0;visibility:hidden;transition:opacity .65s ease,visibility .65s ease}.transition-screen.visible{opacity:1;visibility:visible}.transition-screen span{animation:soft-glow 1.4s ease-in-out infinite alternate}@keyframes soft-glow{from{opacity:.55}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes fall{to{transform:translateY(900px) rotate(330deg);opacity:0}}@keyframes celebrate{0%,100%{transform:scale(1)}45%{transform:scale(1.025) rotate(-.4deg)}}@media(max-height:700px){.cover,.card{height:auto;min-height:94vh}.card{padding:24px 20px}.rule{margin:12px auto}.footer{margin-top:5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}


.rsvp{position:absolute;z-index:2;bottom:28px;left:0;right:0;margin:0 auto;width:max-content;white-space:nowrap;background:#611448;color:#fff8f1;border:1px solid #d9bc84;padding:9px 26px;font:20px 'Cormorant Upright',Georgia,serif;letter-spacing:.08em;cursor:pointer}.rsvp:hover{background:#d9bc84;color:#611448}.petals{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}.petal{position:absolute;top:-12%;color:#e4c8d9;font-size:22px;animation:fall 1.5s ease-in forwards;left:var(--x);animation-delay:var(--d)}@keyframes fall{to{transform:translateY(900px) rotate(330deg);opacity:0}}@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}.rsvp-overlay{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:12px;background:#2c0920cc;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s ease}.rsvp-overlay.visible{opacity:1;visibility:visible}.rsvp-dialog{position:relative;display:flex;flex-direction:column;width:min(100%,760px);height:min(92vh,900px);overflow:hidden;background:#fff;border:1px solid #d9bc84;box-shadow:0 18px 60px #1c061899}.rsvp-bar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;background:#611448;color:#fff8f1;font:20px 'Cormorant Upright',Georgia,serif}.rsvp-close{padding:5px 14px;background:transparent;border:1px solid #d9bc84;color:#fff8f1;font:17px 'Cormorant Upright',Georgia,serif;cursor:pointer}.rsvp-close:hover{background:#d9bc84;color:#611448}.rsvp-frame{width:100%;height:calc(100% - 48px);flex:1;border:0;background:#fff}@media(prefers-reduced-motion:reduce){body{animation:none;opacity:1}.rsvp-overlay{transition:none}}html,body{width:100%;min-height:100%;margin:0;background:#611448}body{display:block;padding:0;overflow-x:hidden;background:#611448}.cover{position:relative;width:100%;max-width:none;height:auto;min-height:0;display:block;overflow:hidden;background:var(--plum);box-shadow:none;margin:0}.cover img{position:relative;display:block;width:100%;height:auto;object-fit:initial;inset:auto}.cover:after{display:none}.rsvp{position:absolute;z-index:5;top:auto;bottom:5%;left:50%;right:auto;transform:translateX(-50%);display:block;margin:0;width:max-content;white-space:nowrap;background:#611448;color:#fff8f1;border:1px solid #d9bc84;padding:8px 24px;font:19px 'Cormorant Upright',Georgia,serif;letter-spacing:.08em;cursor:pointer}@media(max-width:600px){html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}.cover,.cover img{width:100%;max-width:100%}.cover img{height:auto}.rsvp{font-size:clamp(14px,4.3vw,18px);padding:7px clamp(14px,5vw,22px);max-width:calc(100% - 24px)}}@media(max-width:360px){.rsvp{letter-spacing:.04em}}</style></head><body>
<section class="cover" id="cover" aria-label="Wedding invitation cover"><img alt="Luqman and Aina wedding invitation cover" src="%5BFA%5D%20WEDDING%20CARD%20MOBILE.png"><button class="rsvp" id="rsvp">SAHKAN KEHADIRAN</button><div class="petals" id="petals" aria-hidden="true"></div></section>


<audio id="weddingSong" src="wedding-song.mp3" autoplay preload="auto"></audio><div class="rsvp-overlay" id="rsvpOverlay" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle"><div class="rsvp-dialog"><div class="rsvp-bar"><span id="rsvpTitle">Kindly RSVP</span><button class="rsvp-close" id="rsvpClose" type="button">Close</button></div><iframe class="rsvp-frame" id="rsvpFrame" title="Luqman and Aina RSVP form" loading="lazy"></iframe></div></div><script>
const weddingSong=document.getElementById('weddingSong');let weddingSongStarted=false;function startWeddingSong(){if(weddingSongStarted)return;const attempt=weddingSong.play();if(attempt){attempt.then(()=>{weddingSongStarted=true;}).catch(()=>{});}}window.addEventListener('load',startWeddingSong,{once:true});document.addEventListener('pointerdown',startWeddingSong,{once:true,passive:true});document.addEventListener('keydown',startWeddingSong,{once:true});document.getElementById('rsvp').addEventListener('click',function(){const overlay=document.getElementById('rsvpOverlay'),frame=document.getElementById('rsvpFrame');if(!frame.src||frame.src==='about:blank')frame.src='https://form.jotform.com/262850878440061?utm_source=chatgpt.com';overlay.classList.add('visible');});document.getElementById('rsvpClose').addEventListener('click',function(){const overlay=document.getElementById('rsvpOverlay'),frame=document.getElementById('rsvpFrame');overlay.classList.remove('visible');setTimeout(()=>{if(!overlay.classList.contains('visible'))frame.src='about:blank'},1300);});document.addEventListener('keydown',function(event){if(event.key==='Escape')document.getElementById('rsvpClose').click();});
</script></body></html>
